micronaut:
  environment: prod
  application:
    name: cdsi
    version: 1.23.0
    default-charset: utf-8
  executors:
    enclave-jni:
      type: fixed
      # Note: this must never exceed `NumTCS` in `cds.conf`
      number-of-threads: 100
  metrics:
    enabled: true
    export:
      statsd:
        enabled: false
  server:
    port: 8021
    netty:
      # don't compress
      compression-threshold: 1073741824  # 1G
      compression-level: 0

account-table: # AccountTableConfiguration, aws DynamoDB, prod must
  access-key-id:
  secret-access-key:
  region:
  table-name:
  stream-name:
  table-read-segments: 16 #int, default 16,Positive


cosmos: #azure， CosmosClientConfiguration, for CosmosTokenRateLimiter, prod must
  database: #String,NotBlank
  container: #String,NotBlank
  endpoint: #String,NotBlank
  key: #String,NotBlank

redis-leaky-bucket: # LeakyBucketRedisClientFactory, for  RedisLeakyBucketRateLimiter, prod must
  host: #String
  password: #String
  circuit-breaker: #RedisLeakyBucketRateLimiter.executeScript
    reset: 5s
    delay: 500ms
    attempts: 3


leaky-bucket-limit: # EachProperty，LeakyBucketRateLimitConfiguration extends RateLimitConfiguration, for LeakyBucketRateLimiter, prod must
  connections:
    bucket-size: 10 #int,PositiveOrZero
    leak-rate-scalar: 10 #int,PositiveOrZero
    leak-rate-duration: PT1M #Duration

token-rate-limit: # TokenRateLimitConfiguration  extends RateLimitConfiguration, for TokenRateLimiter, prod must
  bucket-size: 50000 #PositiveOrZero
  leak-rate-scalar: 6 #PositiveOrZero
  leak-rate-duration: PT1H


authentication: #AuthenticationConfiguration, must
  shared-secret: Dx9/dxgdVWPazjTqCD6nMdAwS7pnnA5GsiM+aN4pQok= #byte[] min = 32, max = 32
  token-expiration: P1D #Duration, default 1day


enclave: #EnclaveConfiguration, must
  enclave-id: "my-enclave-001" #string, NotBlank
  available-epc-memory: 2048  # 以 MB 为单位 #long, Positive
  load-factor: 1.5 #double, [1.0, 3.0]
  shards: 3 #int, Positive
  token-secret: "my-secret-token-1234567890123456"  # 确保不超过 64 字节 #string,NotBlank @ByteSize(max = 64)
  max-outstanding-requests: 100  #int,Positive
  omit-permits-used: false  #boolean default false
  simulated: true #boolean
  attestation-refresh-interval: 10m # Scheduled
  attestation-initial-delay: 0s # Scheduled
