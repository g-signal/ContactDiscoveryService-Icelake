
# ！！！需要配置隐式的aws credentials，使用环境变量配置path

account-table: # AccountTableConfiguration, aws DynamoDB
  region:
  table-name:
  stream-name:
  table-read-segments: 16 #int, default 16,Positive


cosmos: # CosmosClientConfiguration
  database: #String,NotBlank
  container: #String,NotBlank
  endpoint: #String,NotBlank
  key: #String,NotBlank

redis-leaky-bucket: # LeakyBucketRedisClientFactory
  host: #String
  password: #String
  circuit-breaker:
    reset: 5s
    delay: 500ms
    attempts: 3



leaky-bucket-limit: # EachProperty，LeakyBucketRateLimitConfiguration
  bucket1:
    bucket-size: #int,PositiveOrZero
    leak-rate-scalar: #int,PositiveOrZero
    leak-rate-duration: #Duration
  bucket2:
    bucket-size: #PositiveOrZero
    leak-rate-scalar: #PositiveOrZero
    leak-rate-duration:

token-rate-limit: #TokenRateLimitConfiguration
  bucket-size: #PositiveOrZero
  leak-rate-scalar: #PositiveOrZero
  leak-rate-duration:


authentication: #AuthenticationConfiguration
  shared-secret: #byte[] min = 32, max = 32
  token-expiration: P1D #Duration, default 1day


enclave: #EnclaveConfiguration
  enclave-id: #string, NotBlank
  available-epc-memory: #long, Positive
  load-factor: #double, [1.0, 3.0]
  shards: #int, Positive
  token-secret: #string,NotBlank @ByteSize(max = 64)
  max-outstanding-requests: #int,Positive
  omit-permits-used: false #boolean default false
  simulated: #boolean
  attestation-refresh-interval: 10m # Scheduled
  attestation-initial-delay: 0s # Scheduled

# env = "dev"
random-account-populator: #RandomAccountPopulator
  accounts: 0 # int, default 0



