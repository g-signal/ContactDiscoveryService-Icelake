name: Build and push to Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        type: string

env:
  DOCKER_BUILD_ARGS: --cache-from type=gha --cache-to type=gha
  DOCKER_BUILDKIT: 1
  BUILDX_CONTAINER: container

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout main project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - name: Expose Docker environment variables for gha cache
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Setup Docker
        run: docker buildx create --use --name container --driver docker-container

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: 'temurin'
          java-version-file: .java-version
          cache: 'maven'

      - name: Set up necessary SGX stuff
        run: sudo ./c/docker/sgx_runtime_libraries.sh

      - name: Resolve image tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract enclave MRENCLAVEs
        id: extract_mrenclave
        run: |
          echo "Extracting MRENCLAVE values from built enclaves..."
          cd c
          if [ -f enclave.Standard_DC2s_v3 ]; then
            MRENCLAVE_DC2s=$(${OE_DIR:-/opt/openenclave}/bin/oesign dump -e enclave.Standard_DC2s_v3 | grep -i mrenclave | cut -d '=' -f2)
            echo "Standard_DC2s_v3 MRENCLAVE: $MRENCLAVE_DC2s"
            echo "mrenclave_dc2s=$MRENCLAVE_DC2s" >> $GITHUB_OUTPUT
          fi
          if [ -f enclave.Standard_DC24s_v3 ]; then
            MRENCLAVE_DC24s=$(${OE_DIR:-/opt/openenclave}/bin/oesign dump -e enclave.Standard_DC24s_v3 | grep -i mrenclave | cut -d '=' -f2)
            echo "Standard_DC24s_v3 MRENCLAVE: $MRENCLAVE_DC24s"
            echo "mrenclave_dc24s=$MRENCLAVE_DC24s" >> $GITHUB_OUTPUT
          fi

      - name: Build and push container image
        run: |
          ./mvnw -e -B deploy \
            -Dpackaging=docker \
            -Djib.to.image="${{ secrets.DOCKERHUB_USERNAME }}/cdsi:${{ steps.resolve_tag.outputs.tag }}"

          echo "🎯 Docker image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/cdsi:${{ steps.resolve_tag.outputs.tag }}"
          echo "📋 Enclave IDs for this build:"
          if [ -n "${{ steps.extract_mrenclave.outputs.mrenclave_dc2s }}" ]; then
            echo "  - Standard_DC2s_v3-${{ steps.extract_mrenclave.outputs.mrenclave_dc2s }}"
          fi
          if [ -n "${{ steps.extract_mrenclave.outputs.mrenclave_dc24s }}" ]; then
            echo "  - Standard_DC24s_v3-${{ steps.extract_mrenclave.outputs.mrenclave_dc24s }}"
          fi
